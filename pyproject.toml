[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tstq"
version = "0.1.0"
description = "Tushare data pipeline + Transformer-based A-share quantitative research toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cattle03", url = "https://github.com/cattle03" }]
keywords = ["quant", "tushare", "transformer", "a-share", "alpha", "backtest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=1.4",
    "numpy>=1.21",
    "tqdm>=4.60",
    "matplotlib>=3.5",
    "scikit-learn>=1.0",
    "torch>=2.0",
    "tushare>=1.2",
    "pyarrow>=8.0",
    "openpyxl>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
tstq = "tstq.cli:main"

[project.urls]
Homepage = "https://github.com/cattle03/tushare-transformer-quant"
Repository = "https://github.com/cattle03/tushare-transformer-quant"
Issues = "https://github.com/cattle03/tushare-transformer-quant/issues"

[tool.setuptools.packages.find]
include = ["tstq*"]

[tool.ruff]
line-length = 110
